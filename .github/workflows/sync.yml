name: Weekly Database Sync

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write  # Needed to create and update releases

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymssql pandas

      - name: Run extraction
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: python sync.py

      - name: Compress Database
        run: zip -9 celestial.sqlite3.zip celestial.sqlite3

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Celestial Database Latest Mirror"
          body: |
            Automated weekly clone of the Celestial Altium Library database.
            
            ### Setup
            1. Download `celestial.sqlite3.zip` and the sample `.DbLib` file below.
            2. Extract `celestial.sqlite3.zip` to your local drive.
            3. Open the `.DbLib` file in Altium Designer, update the connection path to your local `.sqlite3` file, and connect.
          files: |
            celestial.sqlite3.zip
            your_file_name.DbLib